name: check upstream

on:
  schedule:
    # Every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The comparison itself lives in scripts/check-upstream.sh, not in this file.
#
# That split is deliberate. The check answers two questions -- "is the pin
# internally consistent?" and "is there a newer upstream release?" -- and both
# are things a maintainer needs to ask locally, before pushing, without waiting
# for the nightly run or reading an Actions log. Keeping the logic in a script
# means the workflow and the local run cannot drift apart, and the script can
# be exercised with `bash -n` and a real run in CI.
#
# This workflow is only the scheduling and reporting shell around it.

jobs:
  check:
    name: Check for a newer komari-agent
    runs-on: ubuntu-latest
    env:
      # Not strictly needed (the script reads the pin from the lock file), but
      # set explicitly so that a change to the default architecture in
      # scripts/build-plugin.sh is exercised here too.
      KOMARI_ARCH: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # A check that cannot run must fail loudly, not report "up to date". The
      # script exits 1 when the pin is incoherent, the API is unreachable or
      # the upstream release cannot be packaged, and this step turns that into
      # a red run.
      - name: Compare the pin with the latest upstream release
        id: upstream
        env:
          # Raises the API rate limit from 60 to 5000 requests per hour. The
          # nightly run is well inside 60, but a burst of manual re-runs is not.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/check-upstream.sh \
            --github-output \
            --issue-body "${RUNNER_TEMP}/issue-body.md"

      - name: Report the result in the job summary
        if: always()
        env:
          CURRENT: ${{ steps.upstream.outputs.current }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          ASSET: ${{ steps.upstream.outputs.asset }}
          NEWER: ${{ steps.upstream.outputs.newer }}
          SHA256: ${{ steps.upstream.outputs.sha256 }}
          SIZE: ${{ steps.upstream.outputs.size }}
        run: |
          set -euo pipefail
          {
            echo "## Upstream check"
            echo
            if [ -z "${LATEST:-}" ]; then
              echo "The check did not produce a result. See the step log above."
              exit 0
            fi
            echo "| | |"
            echo "|---|---|"
            echo "| Pinned | \`${CURRENT}\` |"
            echo "| Latest upstream | \`${LATEST}\` |"
            echo "| Asset | \`${ASSET}\` |"
            echo "| SHA256 | \`${SHA256}\` |"
            echo "| Size | ${SIZE} bytes |"
            echo "| Upgrade available | ${NEWER} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when a newer version exists
        if: steps.upstream.outputs.newer == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest  = '${{ steps.upstream.outputs.latest }}';
            const title   = `chore: bump komari-agent to ${latest}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
            });
            if (issues.some(i => i.title === title)) {
              core.info(`an issue for ${latest} already exists`);
              return;
            }

            // The body is generated by the script, next to the version
            // comparison it describes, so that the two cannot disagree.
            const fs = require('fs');
            const body = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/issue-body.md`, 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['dependencies'],
              body,
            });
