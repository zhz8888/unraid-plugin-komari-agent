<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Komari Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7BF6"/>
      <stop offset="1" stop-color="#123A8C"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="44" ry="44" fill="url(#bg)"/>

  <!-- Monitoring grid: faint rules that read as a dashboard axis. The middle
       rule is omitted on purpose: it would run along the flat part of the
       heartbeat trace and hide it. -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3">
    <line x1="40" y1="96" x2="216" y2="96"/>
    <line x1="40" y1="160" x2="216" y2="160"/>
  </g>

  <!-- Heartbeat trace: the signal the agent reports. -->
  <path d="M36 128 H84 L98 92 L116 168 L134 110 L148 140 L162 128 H220"
        fill="none" stroke="url(#pulse)" stroke-width="11"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
